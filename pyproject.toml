[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "heimdall-osint"
version = "0.1.0"
description = "Production-grade OSINT Link-Analysis Transform & Ingestion Engine (Advanced Maltego Alternative)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Heimdall Engineering Team" }
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "networkx>=3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "rich>=13.0.0",
    "click>=8.0.0"
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.15.0"]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
heimdall = "heimdall.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
